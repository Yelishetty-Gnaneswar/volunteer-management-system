<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Unregistration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            background: #ffffff;
            margin: auto;
            padding: 25px;
            border-radius: 8px;
        }
        .header {
            background: #f2994a;
            color: #ffffff;
            padding: 15px;
            text-align: center;
            border-radius: 6px 6px 0 0;
        }
        .content {
            padding: 20px 0;
            color: #333;
            line-height: 1.6;
        }
        .footer {
            font-size: 12px;
            color: #777;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Registration Cancelled</h2>
    </div>

    <div class="content">
        <p>Dear <b>{{userName}}</b>,</p>

        <p>{{messageLine}}</p>

        <div class="event-box">
            <p><b>Event:</b> {{eventName}}</p>

            <!-- Only for organiser -->
            <p><b>Volunteer Email:</b> {{volunteerEmail}}</p>
        </div>

        <p>If this was unintentional, the volunteer may register again if slots are available.</p>

        <p>Regards,<br><b>VolunteerHub Team</b></p>
    </div>


    <div class="footer">
        © 2026 VolunteerHub. All rights reserved.
    </div>
</div>

</body>
</html>
