<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Event Cancelled</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            background: #ffffff;
            margin: auto;
            padding: 25px;
            border-radius: 8px;
        }
        .header {
            background: #eb5757;
            color: #ffffff;
            padding: 15px;
            text-align: center;
            border-radius: 6px 6px 0 0;
        }
        .content {
            padding: 20px 0;
            color: #333;
            line-height: 1.6;
        }
        .event-box {
            background: #f9fafb;
            padding: 15px;
            border-left: 4px solid #eb5757;
            margin: 15px 0;
        }
        .footer {
            font-size: 12px;
            color: #777;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Event Cancelled</h2>
    </div>

    <div class="content">
        <p>Dear <b>{{userName}}</b>,</p>

        <p>{{messageLine}}</p>

        <div class="event-box">
            <p><b>Event:</b> {{eventName}}</p>
            <p><b>Start Date:</b> {{startDate}}</p>
            <p><b>End Date:</b> {{endDate}}</p>
            <p><b>Location:</b> {{eventLocation}}</p>
        </div>

        <p>We apologise for any inconvenience caused.</p>

        <p>Regards,<br><b>VolunteerHub Team</b></p>
    </div>

    <div class="footer">
        © 2026 VolunteerHub. All rights reserved.
    </div>
</div>

</body>
</html>
